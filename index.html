<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLIMB CHALLENGE</title>
<link rel="icon" type="image/png" href="images/websiteIcon.png">
<link rel="apple-touch-icon" href="images/websiteIcon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070d;
    --row-bg: #0a0a0a;
    --border: #6b6b6b;
    --text-main: #e6e6e6;
    --text-sub: #b8b8b8;
    --orange: #f0a030;
    --green: #3ec95f;
    --red: #e05a5a;
    --purple: #b48af0;
    --gold: #ffd700;
    --silver: #c8ccd4;
    --bronze: #cd7f32;
    --friend-yellow: #f0d030;
    --alumni-orange: #f0a030;
    --student-green: #3ec95f;
    --blue: #4d9dff;
  }

  * { box-sizing: border-box; }

  .slide-gif-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
    /* Hidden by default; JS adds .active only ~5% of the time */
    display: none;
  }

  .slide-gif-overlay.active {
    display: block;
  }

  .slide-gif {
    position: absolute;
    top: 50%;
    left: 100%;
    transform: translate(0, -50%);
    width: 300px;
    height: 300px;
    animation: slideGifAcross 0.8s ease-out forwards,
               slideGifFadeOut 0.5s ease-in 1.2s forwards;
  }

  @keyframes slideGifAcross {
    from { left: 100%; }
    to   { left: -770px; } /* slide fully off the left edge (width + buffer) */
  }

  @keyframes slideGifFadeOut {
    from { opacity: 1; }
    to   { opacity: 0; }
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #0c3215 0%, #34220a 50%, #0a0d14 100%);
    font-family: 'Montserrat', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text-main);
    padding: 50px 24px 70px;
  }

  .page {
    max-width: 880px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 36px;
  }

  .title-icon {
    width: 350px;
    height: 220px;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: 8px;
  }

  .title-text {
    text-align: left;
  }

  h1 {
    font-size: 46px;
    margin: 0px 0;
    font-weight: 800;
    letter-spacing: 0.02em;
    line-height: 1;
  }

  h1 .climb { color: var(--orange); }
  h1 .challenge { color: #6fe08a; }

  .subtitle {
    color: #cfcfcf;
    margin-top: 15px;
    font-size: 24px;
  }

  .summary-bar {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    row-gap: 20px;
    column-gap: 48px;
    margin-bottom: 32px;
  }

  .summary-stat {
    text-align: center;
  }

  .summary-value {
    font-weight: 800;
    font-size: 34px;
    line-height: 1;
  }

  .summary-value.positive { color: var(--green); }
  .summary-value.negative { color: var(--red); }

  .summary-label {
    margin-top: 6px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-sub);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .last-updated {
    text-align: center;
    color: #b0b0b0;
    font-size: 12px;
    margin-bottom: 24px;
  }

  .board {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 22px;
    background: var(--row-bg);
    border-radius: 999px;
    border: 3px solid var(--border);
    padding: 14px 32px 14px 16px;
  }

  .row.rank-1 {
    border-color: var(--gold);
    box-shadow: 0 0 10px 1px rgba(255, 215, 0, 0.55), 0 0 22px 4px rgba(255, 215, 0, 0.3);
  }

  .row.rank-2 {
    border-color: var(--silver);
    box-shadow: 0 0 10px 1px rgba(200, 204, 212, 0.5), 0 0 22px 4px rgba(200, 204, 212, 0.25);
  }

  .row.rank-3 {
    border-color: var(--bronze);
    box-shadow: 0 0 10px 1px rgba(205, 127, 50, 0.5), 0 0 22px 4px rgba(205, 127, 50, 0.25);
  }

  .placement {
    flex-shrink: 0;
    width: 40px;
    text-align: center;
    font-weight: 800;
    font-size: 24px;
    color: var(--text-sub);
    margin-right: 0px;
  }

  .row.rank-1 .placement { color: var(--gold); }
  .row.rank-2 .placement { color: var(--silver); }
  .row.rank-3 .placement { color: var(--bronze); }

  .badge-wrap {
    width: 84px;
    height: 84px;
    flex-shrink: 0;
    border-radius: 50%;
    overflow: hidden;
    background: var(--row-bg);
  }

  .badge {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .info {
    flex: 1;
    min-width: 0;
  }

  .name {
    font-weight: 700;
    font-size: 19px;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .master-tag,
  .student-tag,
  .alumni-tag,
  .friend-tag {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.03em;
    border-radius: 999px;
    padding: 2px 7px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .student-tag {
    color: var(--student-green);
    border: 1px solid var(--student-green);
  }

  .alumni-tag {
    color: var(--alumni-orange);
    border: 1px solid var(--alumni-orange);
  }

  .friend-tag {
    color: var(--friend-yellow);
    border: 1px solid var(--friend-yellow);
  }

  .master-tag {
    color: var(--purple);
    border: 1px solid var(--purple);
  }

  .rank-line {
    font-weight: 600;
    font-size: 15px;
    color: var(--text-sub);
    margin-top: 4px;
  }

  .opgg-link {
    color: var(--blue);
    text-decoration: none;
    font-weight: 400;
  }

  .opgg-link:visited {
    color: var(--blue);
  }

  .opgg-link:hover {
    color: #7ab8ff;
    text-decoration: underline;
  }

  .rank-icon-wrap {
    width: 102px;
    height: 102px;
    flex-shrink: 0;
    overflow: hidden;
  }

  .rank-icon {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .stats {
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    flex-shrink: 0;
  }

  .stats-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .lp-gained {
    font-weight: 700;
    font-size: 16px;
    color: var(--text-main);
    display: flex;
    align-items: center;
  }

  .lp-gained.positive .lp-value { color: var(--green); }
  .lp-gained.negative .lp-value { color: var(--red); }

  .penalty-note {
    font-size: 11px;
    color: var(--purple);
    margin-top: 3px;
  }

  .record {
    font-weight: 600;
    font-size: 15px;
    color: var(--text-sub);
  }

  footer {
    text-align: center;
    color: #b0b0b0;
    font-size: 12px;
    margin-top: 36px;
  }

  /* ---------- Mobile responsive styles ---------- */
  @media (max-width: 640px) {
    body {
      padding: 30px 12px 50px;
    }

    .header-inner {
      flex-direction: column;
      gap: 16px;
    }

    .title-icon {
      width: 200px;
      height: 130px;
    }

    .title-text {
      text-align: center;
    }

    h1 {
      font-size: 30px;
    }

    .subtitle {
      font-size: 16px;
    }

    .summary-bar {
      column-gap: 28px;
      row-gap: 16px;
      margin-bottom: 24px;
    }

    .summary-value {
      font-size: 26px;
    }

    .summary-label {
      font-size: 12px;
    }

    .row {
      flex-wrap: wrap;
      border-radius: 24px;
      padding: 14px 18px;
      gap: 10px;
    }

    .placement {
      width: 26px;
      font-size: 18px;
      margin-right: 8px;
    }

    .badge-wrap {
      width: 56px;
      height: 56px;
    }

    .info {
      min-width: 0;
      flex: 1 1 auto;
    }

    .name {
      font-size: 16px;
    }

    .rank-line {
      font-size: 13px;
    }

    .stats {
      width: 100%;
      padding-left: 92px; /* aligns under the name, past the placement number + badge */
      gap: 10px;
    }

    .rank-icon-wrap {
      width: 45px;
      height: 45px;
    }
  }
</style>
</head>
<body>
  <div class="slide-gif-overlay" id="slideGifOverlay">
    <!-- PUT YOUR GIF PATH HERE -->
    <img class="slide-gif" src="images/skeleton.gif" alt="">
  </div>

  <div class="page">
    <header>
      <div class="header-inner">
        <!-- Paste your 1024x1024 logo/image URL below -->
        <img class="title-icon" src="https://i.imgur.com/p68JQ6b.png" alt="Logo" />
        <div class="title-text">
          <h1><span class="climb">LCS FALL 2026</span> </h1>
          <h1> <span class="challenge">CLIMB CHALLENGE</span></h1>
          <p class="subtitle">Ranked Solo/Duo · LP Gain Leaderboard</p>
        </div>
      </div>
    </header>

    <div class="summary-bar" id="summaryBar" style="display: none;">
      <div class="summary-stat">
        <div class="summary-value" id="totalGames">0</div>
        <div class="summary-label">Total Games Played</div>
      </div>
      <div class="summary-stat">
        <div class="summary-value" id="gamesPerHour">0</div>
        <div class="summary-label">Games / Hour</div>
      </div>
      <div class="summary-stat">
        <div class="summary-value" id="totalLp">0</div>
        <div class="summary-label">Total LP Change</div>
      </div>
    </div>

    <div class="last-updated" id="lastUpdatedTop" style="display: none;">Last updated: <span id="updated"></span></div>

    <div class="board" id="board"></div>

    <footer></footer>
  </div>

<script>
  // ---- Slide-in gif: only fires ~5% of the time on page load ----
  (function () {
    const SLIDE_GIF_CHANCE = 0.05; // 5%
    if (Math.random() < SLIDE_GIF_CHANCE) {
      document.getElementById("slideGifOverlay").classList.add("active");
    }
  })();

  // Players who have reached Master+ at any point during the challenge have their
  // total points counted at reduced effectiveness for leaderboard purposes.
  // The exact reduction depends on manual flags set by hand in data.json:
  //   decayedFromGM  -> 50%  (tagged Master+ but decayed down from GM+)
  //   startedEmerald -> 50%  (tagged Master+ but started the challenge in Emerald)
  //   startedDiamond -> 60%  (tagged Master+ but started the challenge in Diamond)
  //   reachedMaster only (none of the above) -> 66% default
  // Checked in this order — if more than one flag is true, the first match wins.
  const MASTER_EFFECTIVENESS = 0.66;
  const DECAYED_FROM_GM_EFFECTIVENESS = 0.5;
  const STARTED_EMERALD_EFFECTIVENESS = 0.5;
  const STARTED_DIAMOND_EFFECTIVENESS = 0.6;

  // Manual, per-player penalty overrides, keyed by riotId. Applied independently
  // of the Master+ decay system. Edit this map directly to add/remove penalties
  // for specific players. Shown on the leaderboard as a "Reduced Gains" note,
  // same as Master+ adjustments, but does NOT add the MASTER+ tag since the
  // player may not be Master+.
  // Challenge start date — Aug 14, 2026, midnight Central US (CDT, UTC-5).
  const START_DATE = "2026-08-14T05:00:00Z";

  const MANUAL_PENALTIES = {
    "SkyCerberus#Azure": 0.5,
    "angel devil#meow": 0.5,
  };

  function getManualPenalty(p) {
    return Object.prototype.hasOwnProperty.call(MANUAL_PENALTIES, p.riotId)
      ? MANUAL_PENALTIES[p.riotId]
      : null;
  }

  function getEffectiveness(p) {
    const manual = getManualPenalty(p);
    if (manual != null) return manual;
    if (!p.reachedMaster) return 1;
    if (p.decayedFromGM) return DECAYED_FROM_GM_EFFECTIVENESS;
    if (p.startedEmerald) return STARTED_EMERALD_EFFECTIVENESS;
    if (p.startedDiamond) return STARTED_DIAMOND_EFFECTIVENESS;
    return MASTER_EFFECTIVENESS;
  }

  // Short label shown under a Master+ player's name, e.g. "40% Reduced Gains".
  // Derived from getEffectiveness() so the percentage shown always matches the
  // multiplier actually applied — except the plain-Master+ default, which is
  // shown as a clean 33% (the real multiplier stays 0.66, this is display-only).
  function getAdjustmentLabel(p) {
    const manual = getManualPenalty(p);
    if (manual != null) {
      return `${Math.round((1 - manual) * 100)}% Reduced Gains`;
    }
    if (!p.reachedMaster) return "";
    const isDefaultMasterOnly = !p.decayedFromGM && !p.startedEmerald && !p.startedDiamond;
    const reductionPct = isDefaultMasterOnly ? 33 : Math.round((1 - getEffectiveness(p)) * 100);
    return `${reductionPct}% Reduced Gains`;
  }

  // Shows the note whenever there's an active adjustment - Master+ decay OR
  // a manual penalty - so manually-penalized non-Master+ players still see it.
  function hasAdjustmentNote(p) {
    return getManualPenalty(p) != null || p.reachedMaster;
  }

  // Builds an op.gg summoner profile link from a "Name#Tag" riot ID.
  // e.g. "Bones#casts" -> https://op.gg/lol/summoners/na/Bones-casts
  function opggUrl(riotId, region = "na") {
    const [name, tag] = riotId.split("#");
    if (!name || !tag) return null;
    return `https://op.gg/lol/summoners/${region}/${encodeURIComponent(name)}-${encodeURIComponent(tag)}`;
  }

  // Community Dragon serves the full profile icon set (more complete than Data Dragon)
  function profileIconUrl(id) {
    return `https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/${id}.jpg`;
  }

  // Fetch live data instead of using hardcoded players
  fetch('data/data.json?t=' + Date.now())
    .then(response => response.json())
    .then(data => {
      const players = data.players;
      const board = document.getElementById("board");

      // Compute each player's effective (leaderboard) LP.
      // Players who have ever reached Master+ have their gained LP counted
      // at MASTER_EFFECTIVENESS (66%) instead of 100%.
      players.forEach((p) => {
        const rawGained = p.lpGained;
        p.effectiveLp = (rawGained > 0)
          ? Math.round(rawGained * getEffectiveness(p))
          : rawGained;
      });

      // Totals across all players, ignoring any Master+/manual reductions.
      const totalGames = players.reduce((sum, p) => sum + p.wins + p.losses, 0);
      const totalLpChange = players.reduce((sum, p) => sum + p.lpGained, 0);

      // Elapsed hours between challenge start and the leaderboard's last-updated
      // timestamp (not "now"), so rates match the data snapshot being shown.
      const elapsedMs = new Date(data.lastUpdated) - new Date(START_DATE);
      const elapsedHours = Math.max(elapsedMs / (1000 * 60 * 60), 0);
      const gamesPerHour = elapsedHours > 0 ? totalGames / elapsedHours : 0;

      const totalGamesEl = document.getElementById("totalGames");
      const totalLpEl = document.getElementById("totalLp");
      totalGamesEl.textContent = totalGames.toLocaleString();
      totalLpEl.textContent = `${totalLpChange > 0 ? "+" : ""}${totalLpChange.toLocaleString()}`;
      totalLpEl.classList.add(totalLpChange > 0 ? "positive" : (totalLpChange < 0 ? "negative" : ""));

      const gamesPerHourEl = document.getElementById("gamesPerHour");
      gamesPerHourEl.textContent = gamesPerHour.toFixed(1);

      document.getElementById("summaryBar").style.display = "flex";

      players
        .sort((a, b) => b.effectiveLp - a.effectiveLp)
        .forEach((p, index) => {
          const winRate = Math.round((p.wins / (p.wins + p.losses)) * 100) || 0;
          const gainedClass = p.effectiveLp > 0 ? "positive" : (p.effectiveLp < 0 ? "negative" : "");
          const gainedSign = p.effectiveLp > 0 ? "+" : "";

          const row = document.createElement("div");
          row.className = "row";
          if (index === 0) row.classList.add("rank-1");
          else if (index === 1) row.classList.add("rank-2");
          else if (index === 2) row.classList.add("rank-3");
          row.innerHTML = `
            <div class="placement">#${index + 1}</div>
            ${profileImg(p)}
            <div class="info">
              <div class="name">${p.riotId}${p.isStudent ? '<span class="student-tag">STUDENT</span>' : ''}${p.isAlumni ? '<span class="alumni-tag">ALUMNI</span>' : ''}${p.isFriend ? '<span class="friend-tag">FRIEND</span>' : ''}${p.reachedMaster ? '<span class="master-tag">MASTER+</span>' : ''}</div>
              <div class="rank-line">${formatRank(p)}${opggLink(p.riotId)}</div>
              ${hasAdjustmentNote(p) ? `<div class="penalty-note">${getAdjustmentLabel(p)}</div>` : ''}
            </div>
            <div class="stats">
              ${rankIconImg(p.tier)}
              <div class="stats-text">
                <div class="lp-gained ${gainedClass}">
                  <span class="lp-value">LP Gained: ${gainedSign}${p.effectiveLp}</span>
                </div>
                <div class="record">${p.wins}W - ${p.losses}L (${winRate}%)</div>
              </div>
            </div>
          `;
          board.appendChild(row);
        });

      document.getElementById("updated").textContent = new Date(data.lastUpdated).toLocaleString(undefined, {
        year: "numeric",
        month: "numeric",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
      document.getElementById("lastUpdatedTop").style.display = "block";
    })
    .catch(err => {
      console.error("Failed to load rank data:", err);
      document.getElementById("lastUpdatedTop").style.display = "block";
      document.getElementById("updated").textContent = "Failed to load data";
    });

  // Paste your 500x500 rank tier emblem URLs here (one per tier)
  const tierImages = {
    Iron:        "images/ranks/iron.png",
    Bronze:      "images/ranks/bronze.png",
    Silver:      "images/ranks/silver.png",
    Gold:        "images/ranks/gold.png",
    Platinum:    "images/ranks/platinum.png",
    Emerald:     "images/ranks/emerald.png",
    Diamond:     "images/ranks/diamond.png",
    Master:      "images/ranks/master.png",
    Grandmaster: "images/ranks/grandmaster.png",
    Challenger:  "images/ranks/challenger.png",
  };

  function profileImg(p) {
    const url = profileIconUrl(p.profileIconId);
    return `<div class="badge-wrap"><img class="badge" src="${url}" alt="${p.riotId}" /></div>`;
  }

  function rankIconImg(tier) {
    const url = tierImages[tier] || "";
    return `<div class="rank-icon-wrap"><img class="rank-icon" src="${url}" alt="${tier}" /></div>`;
  }

  function opggLink(riotId) {
    const url = opggUrl(riotId);
    if (!url) return "";
    return ` | <a class="opgg-link" href="${url}" target="_blank" rel="noopener noreferrer">OP.GG</a>`;
  }

  const NO_DIVISION_TIERS = ["Master", "Grandmaster", "Challenger"];

  function formatRank(p) {
    const tier = (p.tier || "").trim();
    const isNoDivision = NO_DIVISION_TIERS.some(
      (t) => t.toLowerCase() === tier.toLowerCase()
    );
    if (isNoDivision) {
      return `${tier} - ${p.lp} LP`;
    }
    return p.division ? `${tier} ${p.division} - ${p.lp} LP` : `${tier} - ${p.lp} LP`;
  }

</script>
</body>
</html>
