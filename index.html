<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LOLUTD CLIMB CHALLENGE</title>
<link href="https://fonts.googleapis.com/css2?family=Comforter&display=swap" rel="stylesheet">
<style>
  html, body {
    min-height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #121212;
    color: #e0e0e0;
  }
  p {
    font-family: 'Comforter', cursive;
    font-size: 5rem;
    letter-spacing: 2px;
    
    font-style: italic;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  img {
    max-width: 300px;
    margin-top: -20px;
  }
</style>
</head>
<body>
  <div class="container">
    <p>ayy chill bruh im workin on it damn!!</p>
    <img src="https://static2.klipy.com/ii/4493325008d34b7bf8cd6813cd5c1619/93/42/qlocwRcEWmB87zj.gif" alt="Working on it">
  </div>

  <!-- Local audio tracks: fill in the src="" paths below, e.g. src="audio/track1.mp3" -->
  <audio id="audio1" src="audio/constructionNoise.mp3" loop></audio>
  <audio id="audio2" src="audio/lowBitrateInsrumental.mp3" loop></audio>
  <audio id="audio3" src="audio/peopleTalking.mp3" loop></audio>
  <audio id="audio4" src="audio/zombiePaper.mp3" loop></audio>

  <script>
    const tracks = [
      document.getElementById('audio1'),
      document.getElementById('audio2'),
      document.getElementById('audio3'),
      document.getElementById('audio4'),
    ];

    let started = false;

    function startAudio() {
      if (started) return;
      started = true;
      tracks.forEach(track => {
        if (track.src) {
          track.play().catch(err => console.warn('Playback blocked:', err));
        }
      });
      document.removeEventListener('click', startAudio);
      document.removeEventListener('keydown', startAudio);
    }

    // Browsers require a user gesture before audio can play with sound,
    // so playback starts on the first click or keypress anywhere on the page.
    document.addEventListener('click', startAudio);
    document.addEventListener('keydown', startAudio);
  </script>
</body>
</html>
