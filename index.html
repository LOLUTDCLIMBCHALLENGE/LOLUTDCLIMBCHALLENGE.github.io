<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climb Challenge — Ranked Leaderboard</title>
<style>
  :root {
    --bg: #05070d;
    --row-bg: #0a0a0a;
    --border: #ffffff;
    --text-main: #e6e6e6;
    --text-sub: #b8b8b8;
    --orange: #f0a030;
    --green: #3ec95f;
    --red: #e05a5a;
    --purple: #b48af0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #0c3215 0%, #34220a 50%, #0a0d14 100%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text-main);
    padding: 50px 24px 70px;
  }

  .page {
    max-width: 880px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 36px;
  }

  .title-icon {
    width: 350px;
    height: 220px;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: 8px;
  }

  .title-text {
    text-align: left;
  }

  h1 {
    font-size: 46px;
    margin: 0px 0;
    font-weight: 800;
    letter-spacing: 0.02em;
    line-height: 1;
  }

  h1 .climb { color: var(--orange); }
  h1 .challenge { color: var(--green); }

  .subtitle {
    color: #cfcfcf;
    margin-top: 15px;
    font-size: 24px;
  }

  .board {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 22px;
    background: var(--row-bg);
    border-radius: 999px;
    border: 3px solid var(--border);
    padding: 14px 32px 14px 16px;
  }

  .badge-wrap {
    width: 84px;
    height: 84px;
    flex-shrink: 0;
    border-radius: 50%;
    overflow: hidden;
    background: var(--row-bg);
  }

  .badge {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .info {
    flex: 1;
    min-width: 0;
  }

  .name {
    font-weight: 700;
    font-size: 19px;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .master-tag {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.03em;
    color: var(--purple);
    border: 1px solid var(--purple);
    border-radius: 999px;
    padding: 2px 7px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .rank-line {
    font-weight: 600;
    font-size: 15px;
    color: var(--text-sub);
    margin-top: 4px;
  }

  .rank-icon-wrap {
    width: 102px;
    height: 102px;
    flex-shrink: 0;
    overflow: hidden;
  }

  .rank-icon {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .stats {
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    flex-shrink: 0;
  }

  .stats-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .lp-gained {
    font-weight: 700;
    font-size: 16px;
    color: var(--text-main);
    display: flex;
    align-items: center;
  }

  .lp-gained.positive .lp-value { color: var(--green); }
  .lp-gained.negative .lp-value { color: var(--red); }

  .penalty-note {
    font-size: 11px;
    color: var(--purple);
  }

  .record {
    font-weight: 600;
    font-size: 15px;
    color: var(--text-sub);
  }

  footer {
    text-align: center;
    color: #b0b0b0;
    font-size: 12px;
    margin-top: 36px;
  }

  /* ---------- Mobile responsive styles ---------- */
  @media (max-width: 640px) {
    body {
      padding: 30px 12px 50px;
    }

    .header-inner {
      flex-direction: column;
      gap: 16px;
    }

    .title-icon {
      width: 200px;
      height: 130px;
    }

    .title-text {
      text-align: center;
    }

    h1 {
      font-size: 30px;
    }

    .subtitle {
      font-size: 16px;
    }

    .row {
      flex-wrap: wrap;
      border-radius: 24px;
      padding: 14px 18px;
      gap: 12px;
    }

    .badge-wrap {
      width: 56px;
      height: 56px;
    }

    .info {
      min-width: 0;
      flex: 1 1 auto;
    }

    .name {
      font-size: 16px;
    }

    .rank-line {
      font-size: 13px;
    }

    .stats {
      width: 100%;
      padding-left: 68px; /* aligns under the name, past the badge */
      gap: 10px;
    }

    .rank-icon-wrap {
      width: 45px;
      height: 45px;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <div class="header-inner">
        <!-- Paste your 1024x1024 logo/image URL below -->
        <img class="title-icon" src="https://i.imgur.com/p68JQ6b.png" alt="Logo" />
        <div class="title-text">
          <h1><span class="climb">SUMMER 2026</span> </h1>
          <h1> <span class="challenge">CLIMB CHALLENGE</span></h1>
          <p class="subtitle">Ranked Solo/Duo · LP Gain Leaderboard</p>
        </div>
      </div>
    </header>

    <div class="board" id="board"></div>

    <footer>Last updated: <span id="updated"></span></footer>
  </div>

<script>
  // Players who have reached Master+ at any point during the challenge have their
  // total points counted at this reduced effectiveness for leaderboard purposes.
  const MASTER_EFFECTIVENESS = 0.66;

  // Community Dragon serves the full profile icon set (more complete than Data Dragon)
  function profileIconUrl(id) {
    return `https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/profile-icons/${id}.jpg`;
  }

  // Fetch live data instead of using hardcoded players
  fetch('data/data.json?t=' + Date.now())
    .then(response => response.json())
    .then(data => {
      const players = data.players;
      const board = document.getElementById("board");

      // Compute each player's effective (leaderboard) LP.
      // Players who have ever reached Master+ have their gained LP counted
      // at MASTER_EFFECTIVENESS (66%) instead of 100%.
      players.forEach((p) => {
        const rawGained = p.lpGained;
        p.effectiveLp = p.reachedMaster
          ? Math.round(rawGained * MASTER_EFFECTIVENESS)
          : rawGained;
      });

      players
        .sort((a, b) => b.effectiveLp - a.effectiveLp)
        .forEach((p) => {
          const winRate = Math.round((p.wins / (p.wins + p.losses)) * 100) || 0;
          const gainedClass = p.effectiveLp > 0 ? "positive" : (p.effectiveLp < 0 ? "negative" : "");
          const gainedSign = p.effectiveLp > 0 ? "+" : "";

          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML = `
            ${profileImg(p)}
            <div class="info">
              <div class="name">${p.riotId}${p.reachedMaster ? '<span class="master-tag">MASTER+ PEAK</span>' : ''}</div>
              <div class="rank-line">${formatRank(p)}</div>
            </div>
            <div class="stats">
              ${rankIconImg(p.tier)}
              <div class="stats-text">
                <div class="lp-gained ${gainedClass}">
                  <span class="lp-value">LP Gained: ${gainedSign}${p.effectiveLp}</span>
                </div>
                ${p.reachedMaster ? `<div class="penalty-note">Reduced Points</div>` : ''}
                <div class="record">${p.wins}W - ${p.losses}L (${winRate}%)</div>
              </div>
            </div>
          `;
          board.appendChild(row);
        });

      document.getElementById("updated").textContent = new Date(data.lastUpdated).toLocaleString();
    })
    .catch(err => {
      console.error("Failed to load rank data:", err);
      document.getElementById("updated").textContent = "Failed to load data";
    });

  // Paste your 500x500 rank tier emblem URLs here (one per tier)
  const tierImages = {
    Iron:        "images/ranks/iron.png",
    Bronze:      "images/ranks/bronze.png",
    Silver:      "images/ranks/silver.png",
    Gold:        "images/ranks/gold.png",
    Platinum:    "images/ranks/platinum.png",
    Emerald:     "images/ranks/emerald.png",
    Diamond:     "images/ranks/diamond.png",
    Master:      "images/ranks/master.png",
    Grandmaster: "images/ranks/grandmaster.png",
    Challenger:  "images/ranks/challenger.png",
  };

  function profileImg(p) {
    const url = profileIconUrl(p.profileIconId);
    return `<div class="badge-wrap"><img class="badge" src="${url}" alt="${p.riotId}" /></div>`;
  }

  function rankIconImg(tier) {
    const url = tierImages[tier] || "";
    return `<div class="rank-icon-wrap"><img class="rank-icon" src="${url}" alt="${tier}" /></div>`;
  }

  const NO_DIVISION_TIERS = ["Master", "Grandmaster", "Challenger"];

  function formatRank(p) {
    const tier = (p.tier || "").trim();
    const isNoDivision = NO_DIVISION_TIERS.some(
      (t) => t.toLowerCase() === tier.toLowerCase()
    );
    if (isNoDivision) {
      return `${tier} - ${p.lp} LP`;
    }
    return p.division ? `${tier} ${p.division} - ${p.lp} LP` : `${tier} - ${p.lp} LP`;
  }

</script>
</body>
</html>
