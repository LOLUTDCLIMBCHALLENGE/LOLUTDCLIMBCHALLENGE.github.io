name: Update Rank Data

#resync

on:
  schedule:
    # Runs every 30 minutes (UTC). Adjust as you like.
    # Cron syntax: minute hour day month weekday
    - cron: "48 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated JSON back

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run rank tracker script
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python ClimbChallenge.py

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --staged --quiet || git commit -m "Auto-update rank data"
          git push
